<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Пути Согда — 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.maptiler.com/maptiler-sdk-js/v2.5.1/maptiler-sdk.css" rel="stylesheet" />
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v2.5.1/maptiler-sdk.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo-900: #1a2740;
    --ochre-500: #c98a2c;
    --ochre-400: #dba24f;
    --sand-50: #f6f2e9;
    --sand-100: #ece4d3;
    --ink: #201a10;
    --muted: #7d7460;
    --line: rgba(26,39,64,0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { background: var(--sand-50); color: var(--ink); font-family: 'Manrope', sans-serif; }

  #app { display:flex; flex-direction:column; height:100vh; }

  header {
    background: var(--indigo-900);
    color: var(--sand-50);
    padding: 18px 28px 16px;
    display:flex;
    align-items:flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 3px solid var(--ochre-500);
  }
  header .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.5rem;
    margin: 0;
  }
  header .brand p {
    margin: 4px 0 0;
    font-size: 0.8rem;
    color: #b9c1d4;
  }
  header .controls { display:flex; gap: 8px; }
  header button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: var(--sand-50);
    padding: 7px 14px;
    border-radius: 3px;
    font-family: 'Manrope', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
  }
  header button.active { background: var(--ochre-500); border-color: var(--ochre-500); color: var(--indigo-900); font-weight: 600; }

  #main { flex:1; display:flex; min-height:0; }
  #map { flex:1; position: relative; }

  #sidebar {
    width: 300px;
    background: var(--sand-50);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 18px 16px;
  }
  #sidebar h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--indigo-900);
    margin: 0 0 12px 0;
  }
  .place {
    padding: 11px 4px 11px 14px;
    border-left: 2px solid var(--line);
    cursor: pointer;
    margin-bottom: 2px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .place:hover, .place.active {
    border-left-color: var(--ochre-500);
    background: var(--sand-100);
  }
  .place-name { font-family: 'Fraunces', serif; font-weight: 500; font-size: 0.95rem; color: var(--indigo-900); }
  .place-region { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }

  .maplibregl-popup-content {
    background: var(--indigo-900);
    color: var(--sand-50);
    border-radius: 3px;
    font-family: 'Manrope', sans-serif;
    padding: 12px 14px;
  }
  .maplibregl-popup-tip { border-top-color: var(--indigo-900) !important; border-bottom-color: var(--indigo-900) !important; }
  .popup-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 0.95rem; margin-bottom: 4px; color: var(--ochre-400); }
  .popup-desc { font-size: 0.8rem; line-height: 1.4; color: #d8ddea; }

  #hint {
    position: absolute; bottom: 10px; left: 10px;
    background: rgba(26,39,64,0.85); color: var(--sand-50);
    font-size: 0.72rem; padding: 6px 10px; border-radius: 3px;
    pointer-events: none;
  }

  footer { padding: 6px 28px; font-size: 0.7rem; color: var(--muted); border-top: 1px solid var(--line); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--sand-100); border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>Пути Согда</h1>
      <p>карта культурных и исторических мест Таджикистана — 3D-прототип</p>
    </div>
    <div class="controls">
      <button id="btn2d">2D</button>
      <button id="btn3d" class="active">3D-рельеф</button>
    </div>
  </header>
  <div id="main">
    <div id="map">
      <div id="hint">Зажми правую кнопку мыши / два пальца — чтобы наклонить и повернуть камеру</div>
    </div>
    <div id="sidebar">
      <h2>Места на карте</h2>
      <div id="list"></div>
    </div>
  </div>
  <footer>© MapTiler © OpenStreetMap contributors — демонстрационные точки, рельеф трёхкратно преувеличен для наглядности</footer>
</div>

<script>
const MAPTILER_KEY = "AW2G85tr8OJvUUFFk6kp";
maptilersdk.config.apiKey = MAPTILER_KEY;

const places = [
  { name: "Древний Пенджикент", region: "Согдийская область", lat: 39.4967, lng: 67.6086,
    desc: "Городище согдийской цивилизации VII–VIII вв., называемое 'Среднеазиатскими Помпеями'." },
  { name: "Крепость Хисор", region: "Хисорский район", lat: 38.4783, lng: 68.5486,
    desc: "Историческая крепость XVIII века с медресе и мавзолеем, символ региона." },
  { name: "Истаравшан", region: "Согдийская область", lat: 39.9081, lng: 69.0064,
    desc: "Один из древнейших городов Центральной Азии, известен ремёслами и мечетью Кок-Гумбаз." },
  { name: "Памирский ботанический сад", region: "Хорог, ГБАО", lat: 37.4928, lng: 71.5636,
    desc: "Второй по высоте ботанический сад в мире, ворота в Памирские горы." },
  { name: "Крепость Ямчун", region: "Ваханская долина, ГБАО", lat: 37.1978, lng: 72.4064,
    desc: "Древняя крепость над Ваханской долиной с видом на Гиндукуш." },
  { name: "Национальный музей", region: "Душанбе", lat: 38.5598, lng: 68.7873,
    desc: "Крупнейшее собрание артефактов, включая знаменитого 'Спящего Будду'." }
];

const map = new maptilersdk.Map({
  container: 'map',
  style: maptilersdk.MapStyle.STREETS,
  center: [71.2, 38.4],
  zoom: 6.2,
  pitch: 55,
  bearing: -12,
  terrain: true,
  terrainControl: false,
  maxPitch: 85
});

map.on('load', () => {
  map.setTerrain({ source: 'maptiler-terrain', exaggeration: 1.5 });
});

const markers = {};
const items = {};
const listEl = document.getElementById('list');

function setActive(i) {
  Object.values(items).forEach(el => el.classList.remove('active'));
  if (items[i]) items[i].classList.add('active');
}

places.forEach((p, i) => {
  const el = document.createElement('div');
  el.style.width = '14px';
  el.style.height = '14px';
  el.style.borderRadius = '50%';
  el.style.background = '#1a2740';
  el.style.border = '2px solid #f6f2e9';
  el.style.boxShadow = '0 1px 3px rgba(0,0,0,0.4)';
  el.style.cursor = 'pointer';

  const popup = new maptilersdk.Popup({ offset: 10 }).setHTML(
    `<div class="popup-title">${p.name}</div><div class="popup-desc">${p.desc}</div>`
  );

  const marker = new maptilersdk.Marker({ element: el })
    .setLngLat([p.lng, p.lat])
    .setPopup(popup)
    .addTo(map);

  el.addEventListener('click', () => setActive(i));
  markers[i] = marker;

  const item = document.createElement('div');
  item.className = 'place';
  item.innerHTML = `<div class="place-name">${p.name}</div><div class="place-region">${p.region}</div>`;
  item.addEventListener('click', () => {
    map.flyTo({ center: [p.lng, p.lat], zoom: 11, pitch: 65, duration: 1200 });
    marker.togglePopup();
    setActive(i);
  });
  items[i] = item;
  listEl.appendChild(item);
});

document.getElementById('btn3d').addEventListener('click', () => {
  map.setTerrain({ source: 'maptiler-terrain', exaggeration: 1.5 });
  map.easeTo({ pitch: 55, duration: 600 });
  document.getElementById('btn3d').classList.add('active');
  document.getElementById('btn2d').classList.remove('active');
});
document.getElementById('btn2d').addEventListener('click', () => {
  map.setTerrain(null);
  map.easeTo({ pitch: 0, duration: 600 });
  document.getElementById('btn2d').classList.add('active');
  document.getElementById('btn3d').classList.remove('active');
});
</script>
</body>
</html>
